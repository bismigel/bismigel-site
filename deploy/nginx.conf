# Public site (bismigel.dev, www, …). The operations runbook is NOT served here:
# it lives on runbook.bismigel.dev behind Cloudflare Access.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted assets can be cached for a long time.
    location ~* \.(css|js|woff2|woff|ttf|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The runbook is only reachable on its own Access-gated host.
    location ^~ /projects/runbook { return 404; }

    # Never cache a 404: during a rolling deploy a new asset hash can briefly
    # 404, and a cached 404 (Cloudflare 4h) hides the CSS for hours.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Runbook host (Access-gated at the edge). Serves the runbook page and the
# site's assets; everything else 404s so this is not a second copy of the site.
server {
    listen 80;
    server_name runbook.bismigel.dev;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(css|js|woff2|woff|ttf|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        return 302 /projects/runbook/;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /projects/runbook {
        try_files $uri $uri/ =404;
    }

    location / {
        return 404;
    }
}
