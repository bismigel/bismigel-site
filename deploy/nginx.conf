server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted assets can be cached for a long time.
    location ~* \.(css|js|woff2|woff|ttf|png|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache a 404: during a rolling deploy a new asset hash can briefly
    # 404, and a cached 404 (Cloudflare 4h) hides the CSS for hours.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
