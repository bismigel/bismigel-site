apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bismigel-site
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
    - host: bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bismigel-site
                port:
                  number: 80
    - host: www.bismigel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bismigel-site
                port:
                  number: 80
