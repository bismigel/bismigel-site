apiVersion: apps/v1
kind: Deployment
metadata:
  name: bismigel-site
  namespace: apps
  labels:
    app: bismigel-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bismigel-site
  template:
    metadata:
      labels:
        app: bismigel-site
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Two replicas are only HA if they sit on two nodes. Both landed on sitaw-amd,
      # so losing that node took the whole service down until the scheduler found room.
      # Soft (ScheduleAnyway), so a single-node cluster can still run the workload.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bismigel-site
      containers:
        - name: bismigel-site
          # Tag bumped automatically by .github/workflows/release.yml
          image: ghcr.io/bismigel/bismigel-site:main-20261031-040307-d90081f
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
