apiVersion: apps/v1
kind: Deployment
metadata:
  name: miguelarbis-site
  namespace: apps
  labels:
    app: miguelarbis-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miguelarbis-site
  template:
    metadata:
      labels:
        app: miguelarbis-site
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: miguelarbis-site
          # Tag bumped automatically by .github/workflows/release.yml
          image: ghcr.io/bismigel/bismigel-site:main-20261013-164324-3eddb6a
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
